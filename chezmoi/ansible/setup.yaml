---
- name: Machine setup
  hosts: localhost
  become: true
  remote_user: tmeijn
  connection: local
  gather_facts: true
  vars:
    arch_mapping:  # Map ansible architecture {{ ansible_architecture }} names to Docker's architecture names
      x86_64: amd64
      aarch64: arm64
    # Your Docker daemon configuration as a JSON object
    docker_config:
      registry-mirrors:
        - "https://mirror.gcr.io"
      features:
        containerd-snapshotter: true
      default-address-pools:
        # Allocate Docker networks from the CGNAT range (RFC 6598) instead of
        # the default RFC 1918 ranges (e.g. 172.17.0.0/16) to avoid overlaps
        # with corporate VPN/LAN subnets, which would otherwise break routing
        # to those real hosts.
        - base: "100.64.0.0/10"
          size: 24
    # DisplayLink Driver
    synaptics_package_url: "https://www.synaptics.com/sites/default/files/Ubuntu/pool/stable/main/all/synaptics-repository-keyring.deb"
    synaptics_package_path: "/tmp/synaptics-repository-keyring.deb"
    # kitty terminal: the Ubuntu repos lag far behind upstream, so we install the
    # official binary build into ~/.local/kitty.app (see the kitty block below).
    # Bump this to upgrade; find releases at https://github.com/kovidgoyal/kitty/releases
    kitty_version: "0.48.0"
    # nautilus-open-any-terminal: makes Nautilus' "Open in Terminal" launch kitty
    # instead of the hardcoded gnome-terminal. Releases:
    # https://github.com/Stunkymonkey/nautilus-open-any-terminal/releases
    nautilus_open_any_terminal_version: "0.8.1"

  tasks:
    - name: Setting facts based on ansible_architecture
      block:
        - name: Set facts for amd64
          ansible.builtin.set_fact:
            aws_ssm_plugin_deb_url: https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb
            vscode_deb_url: https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64
          when: ansible_facts["architecture"] == 'x86_64'

        - name: Set facts for arm64
          ansible.builtin.set_fact:
            aws_ssm_plugin_deb_url: https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_arm64/session-manager-plugin.deb
            vscode_deb_url: https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-arm64
          when: ansible_facts["architecture"] == 'aarch64'

    - name: Install core packages
      ansible.builtin.include_tasks:
        file: tasks/install_core_packages.yaml
        apply:
          tags: [core-packages]
      tags: [core-packages]

    - name: Install packages
      ansible.builtin.apt:
        pkg:
          - bubblewrap
          - build-essential
          - curl
          - ffmpeg
          - gawk
          - git
          - gnome-shell-extensions
          - gnome-tweaks
          - graphviz
          - gtk2-engines-murrine
          - jc
          - kitty # Fallback + system-wide terminfo/man pages; the upstream build (see kitty block) overrides it via PATH and a user .desktop entry.
          - libyaml-dev # Needed to make Ruby installation work. Used in GitLab Runbooks
          - lshw
          - nala
          - network-manager-l2tp
          - network-manager-l2tp-gnome
          - pandoc
          - pavucontrol
          - poppler-utils
          - postgresql-client
          - px
          - qemu-system
          - timeshift
          - vim
          - virt-manager
          - xclip
        update_cache: true

    - name: Install KNMI specific packages
      ansible.builtin.apt:
        pkg:
          # Packages needed for the VPN
          - openconnect
          - network-manager-openconnect
          - network-manager-openconnect-gnome
          # Packages needed for Camera?
          # - gstreamer1.0-icamera Package seems not available
          - linux-modules-ipu7-generic-hwe-24.04
        update_cache: true

    - name: "[BLOCK] Setting up DisplayLink drivers"
      block:
        - name: Download Synaptics repository keyring package
          ansible.builtin.get_url:
            url: "{{ synaptics_package_url }}"
            dest: "{{ synaptics_package_path }}"
            mode: '0644'
        # Remove the standalone DisplayLink driver if it was previously installed on the system.
        # This task ensures a clean state before installing a newer version or alternative display driver,
        # preventing conflicts between multiple DisplayLink installations.
        - name: Remove standalone DisplayLink driver (if present)
          ansible.builtin.apt:
            name: displaylink
            state: absent
          failed_when: false

        - name: Install Synaptics APT Repository keyring
          ansible.builtin.apt:
            deb: "{{ synaptics_package_path }}"
            state: present

        - name: Update APT cache
          ansible.builtin.apt:
            update_cache: true

        - name: Install DisplayLink driver
          ansible.builtin.apt:
            name: displaylink-driver
            state: present
            update_cache: true

        - name: Verify DisplayLink driver installation
          ansible.builtin.command: dpkg -l displaylink-driver
          register: displaylink_status
          changed_when: false

        - name: Clean up downloaded package
          ansible.builtin.file:
            path: "{{ synaptics_package_path }}"
            state: absent

    - name: Ensure packages are absent
      ansible.builtin.apt:
        pkg:
          - gnome-shell-extension-ubuntu-dock # This cannot be disabled, see https://askubuntu.com/q/1498249.
        state: absent

    - name: "[BLOCK] Install kitty from upstream (much newer than the Ubuntu repos)"
      # The apt `kitty` package (kept in the package list above) provides system-wide
      # terminfo + man pages and a fallback binary. Because ~/.local/bin is first on
      # PATH and a user .desktop entry overrides the system one, the upstream build
      # installed here is what actually gets used. Fully reversible: delete
      # ~/.local/kitty.app, the ~/.local/bin symlinks and the user .desktop files.
      # Everything here is user-scoped (~/.local), so run as the login user; the
      # two update-alternatives tasks below opt back into root with become: true.
      become: false
      vars:
        # NB: don't use ansible_env.HOME here. The play sets become: true, so facts
        # are gathered as root and ansible_env.HOME would be /root. This block runs
        # as the invoking user (become: false), so resolve their home with a
        # controller-side env lookup, which is evaluated as that user regardless of
        # become and stays consistent with where these tasks actually write.
        kitty_home: "{{ lookup('ansible.builtin.env', 'HOME') }}"
        kitty_install_root: "{{ kitty_home }}/.local"
        kitty_app_dir: "{{ kitty_home }}/.local/kitty.app"
        kitty_local_bin: "{{ kitty_home }}/.local/bin"
        kitty_desktop_dir: "{{ kitty_home }}/.local/share/applications"
        kitty_desktop_files:
          - kitty.desktop
          - kitty-open.desktop
      block:
        - name: Check currently installed upstream kitty version
          ansible.builtin.command: "{{ kitty_app_dir }}/bin/kitty --version"
          register: kitty_installed_version
          changed_when: false
          failed_when: false

        - name: Download the official kitty installer script
          ansible.builtin.get_url:
            url: https://sw.kovidgoyal.net/kitty/installer.sh
            dest: /tmp/kitty-installer.sh
            mode: '0755'
          when: kitty_version not in (kitty_installed_version.stdout | default(''))

        - name: "Install kitty into ~/.local/kitty.app, version {{ kitty_version }}"
          ansible.builtin.command:
            cmd: "sh /tmp/kitty-installer.sh launch=n dest={{ kitty_install_root }} installer=version-{{ kitty_version }}"
          register: kitty_install
          changed_when: kitty_install.rc == 0
          when: kitty_version not in (kitty_installed_version.stdout | default(''))

        - name: Symlink kitty and kitten into ~/.local/bin (first on PATH)
          ansible.builtin.file:
            src: "{{ kitty_app_dir }}/bin/{{ item }}"
            dest: "{{ kitty_local_bin }}/{{ item }}"
            state: link
            force: true
          loop:
            - kitty
            - kitten

        - name: Ensure the user applications directory exists
          ansible.builtin.file:
            path: "{{ kitty_desktop_dir }}"
            state: directory
            mode: '0755'

        - name: Install kitty desktop entries (override the system ones for GNOME)
          ansible.builtin.copy:
            src: "{{ kitty_app_dir }}/share/applications/{{ item }}"
            dest: "{{ kitty_desktop_dir }}/{{ item }}"
            remote_src: true
            mode: '0644'
          loop: "{{ kitty_desktop_files }}"

        - name: Point desktop Exec/TryExec at the upstream kitty binary
          ansible.builtin.replace:
            path: "{{ kitty_desktop_dir }}/{{ item }}"
            regexp: '^(Exec|TryExec)=kitty'
            replace: '\1={{ kitty_app_dir }}/bin/kitty'
          loop: "{{ kitty_desktop_files }}"

        - name: Point desktop Icon at the upstream kitty icon
          ansible.builtin.replace:
            path: "{{ kitty_desktop_dir }}/{{ item }}"
            regexp: '^Icon=kitty$'
            replace: 'Icon={{ kitty_app_dir }}/share/icons/hicolor/256x256/apps/kitty.png'
          loop: "{{ kitty_desktop_files }}"

        - name: Refresh the user desktop database
          ansible.builtin.command: "update-desktop-database {{ kitty_desktop_dir }}"
          changed_when: false

        - name: Register the upstream kitty as an x-terminal-emulator alternative
          # Opts back into root (the block default is become: false) so CLI tools
          # that call x-terminal-emulator (e.g. "open terminal here") also launch
          # the upstream build.
          become: true
          ansible.builtin.command:
            cmd: "update-alternatives --install /usr/bin/x-terminal-emulator x-terminal-emulator {{ kitty_app_dir }}/bin/kitty 60"
          changed_when: false

        - name: Set the upstream kitty as the default x-terminal-emulator
          become: true
          ansible.builtin.command:
            cmd: "update-alternatives --set x-terminal-emulator {{ kitty_app_dir }}/bin/kitty"
          changed_when: false

    - name: "[BLOCK] Make Nautilus 'Open in Terminal' launch kitty"
      # Nautilus' built-in entry comes from nautilus-extension-gnome-terminal, which
      # hardcodes gnome-terminal and ignores x-terminal-emulator. We swap it for
      # nautilus-open-any-terminal (configurable) and point it at kitty.
      vars:
        noat_release_base: "https://github.com/Stunkymonkey/nautilus-open-any-terminal/releases/download"
        noat_deb_name: "nautilus-extension-any-terminal_{{ nautilus_open_any_terminal_version }}-1_all.deb"
        noat_deb_url: "{{ noat_release_base }}/{{ nautilus_open_any_terminal_version }}/{{ noat_deb_name }}"
      block:
        - name: Install Nautilus Python binding and GTK4 introspection
          ansible.builtin.apt:
            pkg:
              - python3-nautilus
              - gir1.2-gtk-4.0
              - python3-psutil # Required by the community.general.dconf module below
            update_cache: true

        - name: Remove GNOME Terminal's Nautilus integration (hardcodes gnome-terminal)
          ansible.builtin.apt:
            name: nautilus-extension-gnome-terminal
            state: absent

        - name: Install nautilus-open-any-terminal (apt downloads the .deb from the URL)
          ansible.builtin.apt:
            deb: "{{ noat_deb_url }}"

        - name: Set kitty as the terminal for "Open in Terminal"
          become: false
          community.general.dconf:
            key: "/com/github/stunkymonkey/nautilus-open-any-terminal/terminal"
            value: "'kitty'"
            state: present

        - name: Restart Nautilus so it picks up the new extension
          become: false
          ansible.builtin.command: nautilus -q
          changed_when: false
          failed_when: false

    - name: "[BLOCK] Setting up Flatpak"
      block:
        - name: Install Flatpak and dependencies if not present
          ansible.builtin.package:
            name:
              - flatpak
              - gnome-software-plugin-flatpak
        - name: Setup Flathub as a remote
          community.general.flatpak_remote:
            name: flathub
            state: present
            flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
        - name: Install Flatpak packages
          community.general.flatpak:
            name:
              - org.videolan.VLC
              - io.github.seadve.Kooha
              - md.obsidian.Obsidian
              - dev.vencord.Vesktop
              - com.github.IsmaelMartinez.teams_for_linux
              - com.slack.Slack
              - org.mozilla.firefox
            state: present

    - name: Install Firefox as snap (arm64 is not available yet on Flatpak)
      community.general.snap:
        name:
          - raindrop

    - name: "[BLOCK] Install AWS Session Manager Plugin if not present"
      block:
        - name: ==== Check if plugin is present
          become: false
          ansible.builtin.shell:
            cmd: command -v session-manager-plugin
          register: aws_ssm_plugin_installed
          ignore_errors: true
          changed_when: false

        - name: ==== Download Plugin
          ansible.builtin.apt:
            deb: "{{ aws_ssm_plugin_deb_url }}"
            state: present
          when: aws_ssm_plugin_installed is failed

    - name: "[BLOCK] Install Visual Studio Code if not present"
      block:
        - name: ==== Check if VSCode is present
          become: false
          ansible.builtin.shell:
            cmd: command -v code
          register: vscode_installed
          ignore_errors: true
          changed_when: false

        - name: ==== Download VSCode
          ansible.builtin.apt:
            deb: "{{ vscode_deb_url }}"
            state: present
          when: vscode_installed is failed

    - name: "[BLOCK] Add repo, install and configure Docker"
      block:
        - name: Add Docker repository
          ansible.builtin.deb822_repository:
            name: docker
            types: deb
            uris: https://download.docker.com/linux/ubuntu
            suites: "{{ ansible_facts['lsb']['codename'] }}"
            components: stable
            architectures: "{{ arch_mapping[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}"
            signed_by: https://download.docker.com/linux/ubuntu/gpg
            state: present
            enabled: true
        - name: Install Docker and related packages
          ansible.builtin.apt:
            pkg:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present
            update_cache: true
        - name: Add Docker group
          ansible.builtin.group:
            name: docker
            state: present
        - name: Add user to Docker group
          ansible.builtin.user:
            name: "{{ ansible_user }}"
            groups: docker
            append: true
        - name: Ensure /etc/docker directory exists
          ansible.builtin.file:
            path: /etc/docker
            state: directory
            mode: '0755'
        - name: Copy Docker daemon configuration
          ansible.builtin.copy:
            content: "{{ docker_config | to_nice_json }}"
            dest: /etc/docker/daemon.json
            mode: '0644'
        - name: Enable and start Docker services
          ansible.builtin.systemd:
            name: "{{ item }}"
            enabled: true
            state: started
          loop:
            - docker.service
            - containerd.service

    - name: "[BLOCK] Add repo and install APTui"
      block:
        - name: Add APTui repository
          ansible.builtin.deb822_repository:
            name: aptui
            types: deb
            uris: https://mexirica.github.io/aptui/
            suites: stable
            components: main
            signed_by: https://mexirica.github.io/aptui/public-key.gpg
            state: present
            enabled: true
        - name: Install APTui
          ansible.builtin.apt:
            pkg:
              - aptui
            state: present
            update_cache: true

    - name: "[BLOCK] Add repo and install RustNet"
      when: ansible_facts["distribution"] == "Ubuntu" and ansible_facts["distribution_major_version"] | int >= 25
      block:
        - name: Add RustNet repository
          ansible.builtin.deb822_repository:
            name: rustnet
            types: deb
            uris: https://ppa.launchpadcontent.net/domcyrus/rustnet/ubuntu
            suites: "{{ ansible_facts['lsb']['codename'] }}"
            components: main
            signed_by: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x02E6E9053D5D53D9A85E142C2985E57C5DF10033"
            state: present
            enabled: true
        - name: Install rustnet
          ansible.builtin.apt:
            pkg:
              - rustnet
            state: present
            update_cache: true
        - name: Grant capabilities to run without sudo
          ansible.builtin.command:
            cmd: setcap 'cap_net_raw,cap_bpf,cap_perfmon+eip' /usr/bin/rustnet
          changed_when: false
          failed_when: false

    - name: "[BLOCK] Add repo, install and configure Incus"
      block:
        # NOTE: suite is hardcoded to noble as Incus does not do non-LTS releases
        - name: Add Incus repository
          ansible.builtin.deb822_repository:
            name: incus
            types: deb
            uris: https://pkgs.zabbly.com/incus/stable
            suites: noble
            components: main
            architectures: "{{ arch_mapping[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}"
            signed_by: https://pkgs.zabbly.com/key.asc
            state: present
            enabled: true
        - name: Install Incus and related packages
          ansible.builtin.apt:
            pkg:
              - incus
            state: present
            update_cache: true
        - name: Add incus-admin group
          ansible.builtin.group:
            name: incus-admin
            state: present
        - name: Add user to incus-admin group
          ansible.builtin.user:
            name: "{{ ansible_user }}"
            groups: incus-admin
            append: true

      # NOTE: this should be absolutely last as afterwards restart is needed.
    - name: Install Pop Shell if not present
      become: false
      block:
        - name: Check if extension is present
          ansible.builtin.shell:
            cmd: gnome-extensions list | grep pop-shell@system76.com -q
          register: gnome_pop_shell_installed
          ignore_errors: true
          changed_when: false

        - name: Download Plugin
          ansible.builtin.shell: |
            npm -g i typescript
            git clone --recursive --depth 1 --shallow-submodules --branch master_noble https://github.com/pop-os/shell.git
            cd shell
            make local-install
            cd ..
            rm -rf shell
          when: gnome_pop_shell_installed is failed

    - name: Install Nerd Fonts if not present
      become: false
      vars:
        nerd_fonts_dir: "/home/{{ ansible_facts['env']['SUDO_USER'] }}/.local/share/fonts/NerdFonts"
        nerd_fonts_list:
          - "FiraCode"
          - "Hack"
          - "JetBrainsMono"
        nerd_fonts_base_url: "https://github.com/ryanoasis/nerd-fonts/releases/latest/download"
      block:
        - name: Ensure fonts directory exists
          ansible.builtin.file:
            path: "{{ nerd_fonts_dir }}"
            state: directory
            mode: '0755'

        - name: Check if font files for each font exist
          shell: |
            ls {{ nerd_fonts_dir }} | grep -qi "{{ item }}"
          register: font_check
          changed_when: false
          failed_when: false
          loop: "{{ nerd_fonts_list }}"
          loop_control:
            label: "{{ item }}"

        - name: Download Nerd Font if not installed
          ansible.builtin.get_url:
            url: "{{ nerd_fonts_base_url }}/{{ item }}.zip"
            dest: "/tmp/{{ item }}.zip"
            mode: '0644'
          when: font_check.results[ansible_loop.index0].rc != 0
          loop: "{{ nerd_fonts_list }}"
          loop_control:
            label: "{{ item }}"
            extended: true

        - name: Extract font files
          ansible.builtin.unarchive:
            src: "/tmp/{{ item }}.zip"
            dest: "{{ nerd_fonts_dir }}"
            remote_src: true
          when: font_check.results[ansible_loop.index0].rc != 0
          loop: "{{ nerd_fonts_list }}"
          loop_control:
            label: "{{ item }}"
            extended: true

        - name: Clean up temporary font zip
          ansible.builtin.file:
            path: "/tmp/{{ item }}.zip"
            state: absent
          when: font_check.results[ansible_loop.index0].rc != 0
          loop: "{{ nerd_fonts_list }}"
          loop_control:
            label: "{{ item }}"
            extended: true

        - name: Update font cache
          ansible.builtin.command: fc-cache -fv
