- name: Ensure git PPA
  ansible.builtin.deb822_repository:
    name: git-core
    types: deb
    uris: https://ppa.launchpadcontent.net/git-core/ppa/ubuntu
    suites: "{{ ansible_facts['lsb']['codename'] }}"
    components: main
    signed_by: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF911AB184317630C59970973E363C90F8F1B6217"
    state: present
    enabled: true

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Install git
  ansible.builtin.apt:
    pkg:
      - git
    state: latest

- name: Install Python dependencies
  ansible.builtin.apt:
    pkg:
      - make
      - build-essential
      - libssl-dev
      - zlib1g-dev
      - libbz2-dev
      - libreadline-dev
      - libsqlite3-dev
      - wget
      - curl
      - llvm
      - libncurses-dev
      - xz-utils
      - tk-dev
      - libxml2-dev
      - libxmlsec1-dev
      - libffi-dev
      - liblzma-dev

- name: Install cmake for Onefetch
  ansible.builtin.apt:
    pkg:
      - cmake

- name: Install dependencies for gnome-extensions-cli
  ansible.builtin.apt:
    pkg:
      - libcairo2-dev
      - libgirepository-2.0-dev
